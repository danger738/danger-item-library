name: Remove Background Batch

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start index"
        required: true
        default: "0"
      limit:
        description: "Number of images"
        required: true
        default: "3000"

jobs:
  remove-bg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install rembg pillow onnxruntime

      - name: Run Batch Script
        run: |
          python process_batch.py \
          ${{ github.event.inputs.start }} \
          ${{ github.event.inputs.limit }}

      - name: Commit Results
        run: |
          git config user.name "github-actions"
          git config user.email "action@github.com"
          git add PNG_TRANSPARENT
          git commit -m "Batch processed" || echo "No changes"
          git push
